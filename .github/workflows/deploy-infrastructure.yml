name: Deploy CDK Infrastructure

on:
  push:
    branches:
      - master
      - feature/*
    paths:
      - 'infrastructure/**'
      - '.github/workflows/deploy-infrastructure.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - deploy
          - destroy
        default: deploy
      force_deploy:
        description: 'Force deploy (skip diff check)'
        required: false
        type: boolean
        default: false
      skip_client_build:
        description: 'Skip client build'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: 20

jobs:
  deploy-infrastructure:
    name: Deploy CDK Stack
    runs-on: ubuntu-latest
    
    # Set up permissions for OIDC if using AWS IAM OIDC (recommended)
    permissions:
      id-token: write
      contents: read
    
    outputs:
      appsync-api-id: ${{ steps.stack-outputs.outputs.appsync-api-id }}
      appsync-api-key: ${{ steps.stack-outputs.outputs.appsync-api-key }}
      audio-processor-url: ${{ steps.stack-outputs.outputs.audio-processor-url }}
      tts-handler-url: ${{ steps.stack-outputs.outputs.tts-handler-url }}
      kvs-channel-arn: ${{ steps.stack-outputs.outputs.kvs-channel-arn }}
      kvs-channel-name: ${{ steps.stack-outputs.outputs.kvs-channel-name }}
      identity-pool-id: ${{ steps.stack-outputs.outputs.identity-pool-id }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🏗️ Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      
      # Configure AWS credentials (uses OIDC if AWS_ROLE_TO_ASSUME is set, otherwise access keys)
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-cdk-deploy
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: 📦 Install CDK dependencies
        working-directory: infrastructure
        run: npm ci
      
      - name: 🔨 Build CDK project
        working-directory: infrastructure
        run: npm run build
      
      - name: 🚀 Deploy CDK Stack
        if: ${{ inputs.action != 'destroy' && (github.event_name == 'push' || inputs.action == 'deploy') }}
        working-directory: infrastructure
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Deploying CDK stack to ${{ vars.AWS_REGION }}..."
          
          echo "🔍 Synthesizing CDK stack..."
          npx cdk synth
          
          echo "🚀 Deploying stack..."
          npx cdk deploy --all --require-approval never --outputs-file outputs.json
          
          echo "✅ Deployment completed"
          
          # Verify outputs.json was created
          if [ ! -f outputs.json ]; then
            echo "❌ Error: outputs.json was not created after deployment"
            exit 1
          fi
          
          echo "📄 Checking outputs.json structure..."
          cat outputs.json | jq '.'
      
      - name: 💾 Upload CDK Outputs
        if: ${{ inputs.action != 'destroy' && (github.event_name == 'push' || inputs.action == 'deploy') }}
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs
          path: infrastructure/outputs.json
          retention-days: 30
      
      - name: 📋 Parse Stack Outputs
        if: ${{ inputs.action != 'destroy' && (github.event_name == 'push' || inputs.action == 'deploy') }}
        id: stack-outputs
        working-directory: infrastructure
        run: |
          if [ -f outputs.json ]; then
            echo "📄 Raw outputs.json contents:"
            cat outputs.json
            echo ""
            echo "Parsing CDK outputs..."
            
            # List all keys in the stack output
            echo "🔍 Available output keys:"
            cat outputs.json | jq -r '.BorderlessVoiceCommStack | keys[]' || echo "Could not list keys"
            echo ""
            
            # Parse the outputs
            APPSYNC_API_ID=$(cat outputs.json | jq -r '.BorderlessVoiceCommStack.AppSyncEventsApiId // ""')
            APPSYNC_API_KEY=$(cat outputs.json | jq -r '.BorderlessVoiceCommStack.AppSyncApiKey // ""')
            AUDIO_PROCESSOR_URL=$(cat outputs.json | jq -r '.BorderlessVoiceCommStack.AudioProcessorUrl // ""')
            TTS_HANDLER_URL=$(cat outputs.json | jq -r '.BorderlessVoiceCommStack.TTSHandlerUrl // ""')
            KVS_CHANNEL_ARN=$(cat outputs.json | jq -r '.BorderlessVoiceCommStack.KVSSignalingChannelARN // ""')
            KVS_CHANNEL_NAME=$(cat outputs.json | jq -r '.BorderlessVoiceCommStack.KVSSignalingChannelName // ""')
            IDENTITY_POOL_ID=$(cat outputs.json | jq -r '.BorderlessVoiceCommStack.CognitoIdentityPoolId // ""')
            
            # Debug: Show what we extracted
            echo "📊 Extracted values:"
            echo "  AppSync API ID: $APPSYNC_API_ID"
            echo "  AppSync API Key: ${APPSYNC_API_KEY:0:10}..."
            echo "  Audio Processor URL: $AUDIO_PROCESSOR_URL"
            echo "  TTS Handler URL: $TTS_HANDLER_URL"
            echo "  KVS Channel ARN: $KVS_CHANNEL_ARN"
            echo "  KVS Channel Name: $KVS_CHANNEL_NAME"
            echo "  Identity Pool ID: $IDENTITY_POOL_ID"
            
            # Validate critical outputs
            if [ -z "$KVS_CHANNEL_ARN" ]; then
              echo "⚠️ Warning: KVS Channel ARN is empty in outputs.json!"
              echo "Attempting to fetch from CloudFormation stack directly..."
              
              # Try to get it from CloudFormation stack outputs
              KVS_CHANNEL_ARN=$(aws cloudformation describe-stacks \
                --stack-name BorderlessVoiceCommStack \
                --query 'Stacks[0].Outputs[?OutputKey==`KVSSignalingChannelARN`].OutputValue' \
                --output text 2>/dev/null || echo "")
              
              if [ ! -z "$KVS_CHANNEL_ARN" ] && [ "$KVS_CHANNEL_ARN" != "None" ]; then
                echo "✅ Found KVS Channel ARN from CloudFormation: $KVS_CHANNEL_ARN"
                # Update the KVS_CHANNEL_NAME as well
                KVS_CHANNEL_NAME=$(aws cloudformation describe-stacks \
                  --stack-name BorderlessVoiceCommStack \
                  --query 'Stacks[0].Outputs[?OutputKey==`KVSSignalingChannelName`].OutputValue' \
                  --output text 2>/dev/null || echo "borderless-voice-comm-signaling")
                echo "✅ KVS Channel Name: $KVS_CHANNEL_NAME"
              else
                echo "⚠️ Could not find KVS Channel ARN in CloudFormation outputs either."
                echo "Checking if KVS channel exists in AWS..."
                aws kinesisvideo list-signaling-channels --query 'ChannelInfoList[?ChannelName==`borderless-voice-comm-signaling`]' || true
              fi
            fi
            
            # Final validation before writing outputs
            echo ""
            echo "📝 Final values to be written to outputs:"
            echo "  AppSync API ID: $APPSYNC_API_ID"
            echo "  AppSync API Key: ${APPSYNC_API_KEY:0:10}..."
            echo "  Audio Processor URL: $AUDIO_PROCESSOR_URL"
            echo "  TTS Handler URL: $TTS_HANDLER_URL"
            echo "  KVS Channel ARN: $KVS_CHANNEL_ARN"
            echo "  KVS Channel Name: $KVS_CHANNEL_NAME"
            echo "  Identity Pool ID: $IDENTITY_POOL_ID"
            
            # Write to GITHUB_OUTPUT
            echo "appsync-api-id=$APPSYNC_API_ID" >> $GITHUB_OUTPUT
            echo "appsync-api-key=$APPSYNC_API_KEY" >> $GITHUB_OUTPUT
            echo "audio-processor-url=$AUDIO_PROCESSOR_URL" >> $GITHUB_OUTPUT
            echo "tts-handler-url=$TTS_HANDLER_URL" >> $GITHUB_OUTPUT
            echo "kvs-channel-arn=$KVS_CHANNEL_ARN" >> $GITHUB_OUTPUT
            echo "kvs-channel-name=$KVS_CHANNEL_NAME" >> $GITHUB_OUTPUT
            echo "identity-pool-id=$IDENTITY_POOL_ID" >> $GITHUB_OUTPUT
            
            echo "✅ Stack outputs extracted successfully"
          else
            echo "⚠️ No outputs.json found"
            exit 1
          fi
      
      - name: 🗑️ Destroy CDK Stack
        if: ${{ inputs.action == 'destroy' }}
        working-directory: infrastructure
        run: |
          echo "⚠️ Destroying CDK stack in ${{ vars.AWS_REGION }}..."
          npx cdk destroy --force
          echo "✅ Stack destroyed successfully"
      
      - name: 📊 Display Deployment Summary
        if: ${{ inputs.action != 'destroy' && (github.event_name == 'push' || inputs.action == 'deploy') }}
        run: |
          echo "## 🎉 CDK Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| AppSync API ID | \`${{ steps.stack-outputs.outputs.appsync-api-id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| KVS Channel ARN | \`${{ steps.stack-outputs.outputs.kvs-channel-arn }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| KVS Channel Name | \`${{ steps.stack-outputs.outputs.kvs-channel-name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Identity Pool ID | \`${{ steps.stack-outputs.outputs.identity-pool-id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Deployment Info:" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ vars.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "- **Action:** ${{ inputs.action }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Skip Client:** ${{ inputs.skip_client_build }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Cognito Identity Pool is configured via CDK" >> $GITHUB_STEP_SUMMARY
          echo "2. Client will be built automatically" >> $GITHUB_STEP_SUMMARY
          echo "3. Review the full deployment in the Summary tab" >> $GITHUB_STEP_SUMMARY

  deploy-client:
    name: Build and Deploy Client
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_client_build && inputs.action != 'destroy' && (github.event_name == 'push' || inputs.action == 'deploy') && github.ref == 'refs/heads/master' }}
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-cognito-setup
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: 📝 Create .env.local
        run: |
          cat > .env.local <<EOF
          VITE_AWS_REGION=${{ vars.AWS_REGION }}
          VITE_IDENTITY_POOL_ID=${{ needs.deploy-infrastructure.outputs.identity-pool-id }}
          VITE_KVS_CHANNEL_ARN=${{ needs.deploy-infrastructure.outputs.kvs-channel-arn }}
          VITE_KVS_CHANNEL_NAME=${{ needs.deploy-infrastructure.outputs.kvs-channel-name }}
          VITE_APPSYNC_API_ID=${{ needs.deploy-infrastructure.outputs.appsync-api-id }}
          VITE_APPSYNC_API_KEY=${{ needs.deploy-infrastructure.outputs.appsync-api-key }}
          VITE_AUDIO_PROCESSOR_URL=${{ needs.deploy-infrastructure.outputs.audio-processor-url }}
          VITE_TTS_HANDLER_URL=${{ needs.deploy-infrastructure.outputs.tts-handler-url }}
          VITE_TRANSCRIPTION_CHANNEL=transcription-events
          VITE_TRANSLATION_CHANNEL=translation-events
          VITE_TTS_CHANNEL=tts-events
          EOF
          
          echo "✅ Created .env.local file"
      
      - name: 🔨 Build client
        run: npm run build
      
      - name: 📊 Display Build Summary
        run: |
          echo "## 🎨 Client Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Client built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Configuration" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat .env.local >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      
      # Deploy to S3/CloudFront
      - name: 🚀 Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.WEBAPP_BUCKET }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.WEBAPP_CDN }} --paths "/*"

